<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - Admin Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== KONTEN ADMIN ======== -->
    <div class="container py-4">
        <div class="card-container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="bi bi-gear" style="color: #C77986;"></i> Kelola Produk</h3>
                <a href="/admin/produk/form" class="btn btn-lensique">
                    <i class="bi bi-plus-circle"></i> Tambah Produk
                </a>
            </div>

            <!-- Filter Pencarian -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="searchInput" 
                           placeholder="Cari produk..." style="border-radius: 15px;"
                           onkeypress="if(event.key==='Enter') loadProducts()">
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="categoryFilter" style="border-radius: 15px;" onchange="loadProducts()">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-lensique-blue w-100" onclick="loadProducts()">
                        <i class="bi bi-search"></i> Cari
                    </button>
                </div>
            </div>

            <!-- Tabel Produk -->
            <div class="table-responsive">
                <table class="table table-lensique">
                    <thead>
                        <tr>
                            <th>Gambar</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">
                                <div class="spinner-lensique"></div>
                                <p class="mt-2 text-muted">Memuat data...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginasi -->
            <nav>
                <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <!-- Modal Konfirmasi Hapus -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 24px; border: none;">
                <div class="modal-header" style="border: none;">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger"></i> Konfirmasi Hapus</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Apakah Anda yakin ingin menghapus produk <strong id="deleteProductName"></strong>?</p>
                    <p class="text-muted">Tindakan ini tidak dapat dibatalkan.</p>
                </div>
                <div class="modal-footer" style="border: none;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="border-radius: 15px;">Batal</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn" style="border-radius: 15px;">
                        <i class="bi bi-trash"></i> Hapus
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN KELOLA PRODUK (ADMIN)
        // ============================================

        // Cek akses admin
        if (!isLoggedIn() || !isAdmin()) {
            showAlert('Akses ditolak. Halaman ini hanya untuk admin.', 'danger');
            setTimeout(() => window.location.href = '/', 1500);
        }

        let deleteProductId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadProducts();
        });

        // Muat kategori
        async function loadCategories() {
            const data = await fetchAPI('/admin/produk/kategori');
            if (data.success) {
                const select = document.getElementById('categoryFilter');
                data.data.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.id;
                    opt.textContent = cat.name;
                    select.appendChild(opt);
                });
            }
        }

        // Muat daftar produk
        async function loadProducts(page = 1) {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-lensique"></div></td></tr>';

            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            let url = `/admin/produk?page=${page}&limit=20`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (category) url += `&category=${category}`;

            const data = await fetchAPI(url);
            if (data.success && data.data.length > 0) {
                tbody.innerHTML = data.data.map(p => `
                    <tr>
                        <td>
                            <img src="${p.image_url || '/public/img/no-image.svg'}" 
                                 style="width: 60px; height: 60px; object-fit: cover; border-radius: 12px;"
                                 onerror="this.src='/public/img/no-image.svg'">
                        </td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.category_name || '-'}</td>
                        <td>${formatRupiah(p.base_price)}</td>
                        <td>
                            <span class="${p.stock > 0 ? 'text-success' : 'text-danger'} fw-bold">${p.stock}</span>
                        </td>
                        <td>
                            <span class="badge-status ${p.is_active ? 'badge-delivered' : 'badge-cancelled'}">
                                ${p.is_active ? 'Aktif' : 'Nonaktif'}
                            </span>
                        </td>
                        <td>
                            <a href="/admin/produk/form?id=${p.id}" class="btn btn-lensique-blue btn-sm me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-outline-danger btn-sm" onclick="showDeleteModal(${p.id}, '${p.name.replace(/'/g, "\\'")}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Paginasi
                const { page: currentPage, totalPages } = data.pagination;
                const pag = document.getElementById('pagination');
                if (totalPages > 1) {
                    let html = '';
                    for (let i = 1; i <= totalPages; i++) {
                        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" onclick="loadProducts(${i})"
                               style="${i === currentPage ? 'background: var(--soft-pink); border-color: var(--soft-pink); color: var(--dark-text);' : ''}">${i}</a>
                        </li>`;
                    }
                    pag.innerHTML = html;
                } else {
                    pag.innerHTML = '';
                }
            } else {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="text-center py-4">
                        <i class="bi bi-inbox" style="font-size: 2rem; color: var(--soft-pink);"></i>
                        <p class="text-muted mt-2">Belum ada produk.</p>
                    </td></tr>
                `;
            }
        }

        // Tampilkan modal konfirmasi hapus
        function showDeleteModal(id, name) {
            deleteProductId = id;
            document.getElementById('deleteProductName').textContent = name;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }

        // Konfirmasi hapus produk
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteProductId) return;

            const data = await fetchAPI(`/admin/produk/${deleteProductId}`, { method: 'DELETE' });
            
            bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();

            if (data.success) {
                showAlert('Produk berhasil dihapus.', 'success');
                loadProducts();
            } else {
                showAlert(data.message || 'Gagal menghapus produk.', 'danger');
            }
        });
    </script>
</body>
</html>
