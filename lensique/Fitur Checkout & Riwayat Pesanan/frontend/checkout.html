<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== KONTEN CHECKOUT ======== -->
    <div class="container py-4">
        <h3 class="mb-4"><i class="bi bi-credit-card" style="color: #C77986;"></i> Checkout</h3>

        <div class="row">
            <!-- Form Checkout -->
            <div class="col-lg-7 mb-4">
                <form id="checkoutForm" class="form-lensique">
                    <!-- Info Pengiriman -->
                    <div class="card-container mb-4">
                        <h5 class="mb-3"><i class="bi bi-truck" style="color: #5DADE2;"></i> Informasi Pengiriman</h5>

                        <div class="mb-3">
                            <label for="recipient_name" class="form-label">Nama Penerima</label>
                            <input type="text" class="form-control" id="recipient_name" placeholder="Nama lengkap penerima" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Nomor Telepon</label>
                            <input type="tel" class="form-control" id="phone" placeholder="08xxxxxxxxxx" required>
                        </div>

                        <div class="mb-3">
                            <label for="shipping_address" class="form-label">Alamat Pengiriman</label>
                            <textarea class="form-control" id="shipping_address" rows="3" 
                                      placeholder="Alamat lengkap (jalan, RT/RW, kelurahan, kecamatan, kota, kode pos)" required></textarea>
                        </div>
                    </div>

                    <!-- Metode Pembayaran -->
                    <div class="card-container mb-4">
                        <h5 class="mb-3"><i class="bi bi-wallet2" style="color: #A569BD;"></i> Metode Pembayaran</h5>

                        <div class="mb-2">
                            <div class="form-check p-3 rounded-3" style="background: var(--soft-pink); border-radius: 15px !important;">
                                <input class="form-check-input" type="radio" name="payment_method" id="bank_transfer" value="bank_transfer" checked>
                                <label class="form-check-label fw-bold" for="bank_transfer">
                                    <i class="bi bi-bank"></i> Transfer Bank
                                </label>
                            </div>
                        </div>
                        <div class="mb-2">
                            <div class="form-check p-3 rounded-3" style="background: var(--baby-blue); border-radius: 15px !important;">
                                <input class="form-check-input" type="radio" name="payment_method" id="e_wallet" value="e_wallet">
                                <label class="form-check-label fw-bold" for="e_wallet">
                                    <i class="bi bi-phone"></i> E-Wallet (OVO/GoPay/DANA)
                                </label>
                            </div>
                        </div>
                        <div class="mb-2">
                            <div class="form-check p-3 rounded-3" style="background: var(--soft-purple); border-radius: 15px !important;">
                                <input class="form-check-input" type="radio" name="payment_method" id="cod" value="cod">
                                <label class="form-check-label fw-bold" for="cod">
                                    <i class="bi bi-cash"></i> COD (Bayar di Tempat)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Tombol Checkout -->
                    <button type="submit" class="btn btn-lensique w-100 btn-lg" id="checkoutBtn">
                        <i class="bi bi-bag-check"></i> Buat Pesanan
                    </button>
                </form>
            </div>

            <!-- Ringkasan Pesanan -->
            <div class="col-lg-5">
                <div class="card-container" style="position: sticky; top: 100px;">
                    <h5 class="mb-3">Ringkasan Pesanan</h5>
                    <div id="orderItems">
                        <div class="text-center py-3">
                            <div class="spinner-lensique"></div>
                        </div>
                    </div>
                    <hr style="border-color: var(--border-color);">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="subtotal">Rp 0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Ongkos Kirim</span>
                        <span class="text-success">Gratis</span>
                    </div>
                    <hr style="border-color: var(--border-color);">
                    <div class="d-flex justify-content-between">
                        <strong>Total Bayar</strong>
                        <strong style="color: #C77986; font-size: 1.3rem;" id="totalBayar">Rp 0</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Sukses -->
    <div class="modal fade" id="successModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center" style="border-radius: 28px; border: none; padding: 40px;">
                <div style="font-size: 4rem; color: var(--success);">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <h3 class="mt-3 fw-bold">Pesanan Berhasil!</h3>
                <p class="text-muted">Nomor Pesanan: <strong id="orderNumberDisplay"></strong></p>
                <p class="text-muted">Total: <strong id="totalDisplay" style="color: #C77986;"></strong></p>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <a href="/user/orders" class="btn btn-lensique">
                        <i class="bi bi-receipt"></i> Lihat Pesanan
                    </a>
                    <a href="/katalog" class="btn btn-lensique-outline">
                        <i class="bi bi-grid"></i> Lanjut Belanja
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN CHECKOUT
        // ============================================

        if (!isLoggedIn()) window.location.href = '/login';

        document.addEventListener('DOMContentLoaded', loadCheckoutData);

        // Muat data checkout (item keranjang + profil)
        async function loadCheckoutData() {
            try {
                const data = await fetchAPI('/orders/checkout-data');
                if (data.success) {
                    const { items, total, profile } = data.data;

                    if (!items || items.length === 0) {
                        showAlert('Keranjang kosong. Silakan tambah produk dulu.', 'danger');
                        setTimeout(() => window.location.href = '/katalog', 1500);
                        return;
                    }

                    // Render item pesanan
                    const container = document.getElementById('orderItems');
                    container.innerHTML = items.map(item => `
                        <div class="d-flex gap-2 mb-2 pb-2 border-bottom" style="border-color: var(--border-color) !important;">
                            <img src="${item.image_url || '/public/img/no-image.svg'}" 
                                 class="rounded-2" style="width: 50px; height: 50px; object-fit: cover;"
                                 onerror="this.src='/public/img/no-image.svg'">
                            <div class="flex-grow-1">
                                <small class="fw-bold d-block">${item.name}</small>
                                <small class="text-muted">${item.quantity}x ${formatRupiah(item.price)}</small>
                            </div>
                            <small class="fw-bold">${formatRupiah(item.price * item.quantity)}</small>
                        </div>
                    `).join('');

                    document.getElementById('subtotal').textContent = formatRupiah(total);
                    document.getElementById('totalBayar').textContent = formatRupiah(total);

                    // Auto-fill dari profil jika ada
                    if (profile) {
                        if (profile.full_name) document.getElementById('recipient_name').value = profile.full_name;
                        if (profile.phone) document.getElementById('phone').value = profile.phone;
                        if (profile.address) document.getElementById('shipping_address').value = profile.address;
                    }
                }
            } catch (e) {
                showAlert('Gagal memuat data checkout.', 'danger');
            }
        }

        // Handle submit checkout
        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = true;
            checkoutBtn.innerHTML = '<div class="spinner-border spinner-border-sm me-2"></div> Memproses...';

            const payload = {
                recipient_name: document.getElementById('recipient_name').value,
                phone: document.getElementById('phone').value,
                shipping_address: document.getElementById('shipping_address').value,
                payment_method: document.querySelector('input[name="payment_method"]:checked').value
            };

            try {
                const data = await fetchAPI('/orders/checkout', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (data.success) {
                    // Tampilkan modal sukses
                    document.getElementById('orderNumberDisplay').textContent = data.data.order_number;
                    document.getElementById('totalDisplay').textContent = formatRupiah(data.data.total_amount);
                    new bootstrap.Modal(document.getElementById('successModal')).show();
                    updateCartCount();
                } else {
                    showAlert(data.message || 'Checkout gagal.', 'danger');
                    checkoutBtn.disabled = false;
                    checkoutBtn.innerHTML = '<i class="bi bi-bag-check"></i> Buat Pesanan';
                }
            } catch (error) {
                showAlert('Terjadi kesalahan koneksi.', 'danger');
                checkoutBtn.disabled = false;
                checkoutBtn.innerHTML = '<i class="bi bi-bag-check"></i> Buat Pesanan';
            }
        });
    </script>
</body>
</html>
