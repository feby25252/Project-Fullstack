<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== KONTEN KERANJANG ======== -->
    <div class="container py-4">
        <h3 class="mb-4"><i class="bi bi-cart3" style="color: #C77986;"></i> Keranjang Belanja</h3>

        <div class="row">
            <!-- Daftar Item -->
            <div class="col-lg-8 mb-4">
                <div class="card-container" id="cartItems">
                    <div class="text-center py-5">
                        <div class="spinner-lensique"></div>
                        <p class="mt-3 text-muted">Memuat keranjang...</p>
                    </div>
                </div>
            </div>

            <!-- Ringkasan Belanja -->
            <div class="col-lg-4">
                <div class="card-container" id="cartSummary" style="position: sticky; top: 100px;">
                    <h5 class="mb-3">Ringkasan Belanja</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Total Item</span>
                        <span id="totalItems">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Total Harga</span>
                        <span class="fw-bold" style="color: #C77986;" id="totalPrice">Rp 0</span>
                    </div>
                    <hr style="border-color: var(--border-color);">
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total Bayar</strong>
                        <strong style="color: #C77986; font-size: 1.2rem;" id="totalBayar">Rp 0</strong>
                    </div>
                    <a href="/checkout" class="btn btn-lensique w-100 mb-2" id="checkoutBtn" style="display: none;">
                        <i class="bi bi-credit-card"></i> Checkout
                    </a>
                    <a href="/katalog" class="btn btn-lensique-outline w-100">
                        <i class="bi bi-arrow-left"></i> Lanjut Belanja
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN KERANJANG BELANJA
        // ============================================

        if (!isLoggedIn()) window.location.href = '/login';

        document.addEventListener('DOMContentLoaded', loadCart);

        // Muat isi keranjang
        async function loadCart() {
            const container = document.getElementById('cartItems');
            try {
                const data = await fetchAPI('/keranjang');
                if (data.success && data.data.items && data.data.items.length > 0) {
                    const items = data.data.items;

                    container.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-muted">${items.length} item di keranjang</span>
                            <button class="btn btn-outline-danger btn-sm" style="border-radius: 15px;" onclick="clearCart()">
                                <i class="bi bi-trash"></i> Kosongkan
                            </button>
                        </div>
                        ${items.map(item => `
                            <div class="d-flex gap-3 mb-3 pb-3 border-bottom" style="border-color: var(--border-color) !important;" id="cartItem-${item.id}">
                                <img src="${item.image_url || '/public/img/no-image.svg'}" 
                                     class="rounded-3" 
                                     style="width: 90px; height: 90px; object-fit: cover;"
                                     onerror="this.src='/public/img/no-image.svg'">
                                <div class="flex-grow-1">
                                    <h6 class="mb-1">
                                        <a href="/produk/${item.product_id}" style="color: var(--dark-text);">${item.name}</a>
                                    </h6>
                                    <p class="fw-bold mb-2" style="color: #C77986;">${formatRupiah(item.price)}</p>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="qty-control">
                                            <button onclick="updateQty(${item.id}, ${item.quantity - 1}, ${item.product_id})">-</button>
                                            <input type="number" value="${item.quantity}" readonly id="qty-${item.id}">
                                            <button onclick="updateQty(${item.id}, ${item.quantity + 1}, ${item.product_id})">+</button>
                                        </div>
                                        <span class="text-muted">= <strong>${formatRupiah(item.price * item.quantity)}</strong></span>
                                    </div>
                                </div>
                                <button class="btn btn-outline-danger btn-sm align-self-start" 
                                        style="border-radius: 50%; width: 34px; height: 34px; padding: 0;"
                                        onclick="removeItem(${item.id})">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        `).join('')}
                    `;

                    // Update ringkasan
                    document.getElementById('totalItems').textContent = items.length + ' item';
                    document.getElementById('totalPrice').textContent = formatRupiah(data.data.total);
                    document.getElementById('totalBayar').textContent = formatRupiah(data.data.total);
                    document.getElementById('checkoutBtn').style.display = 'block';

                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-cart-x"></i>
                            <h4>Keranjang Kosong</h4>
                            <p>Belum ada produk di keranjang kamu.</p>
                            <a href="/katalog" class="btn btn-lensique mt-2">Mulai Belanja</a>
                        </div>
                    `;
                    document.getElementById('totalItems').textContent = '0 item';
                    document.getElementById('totalPrice').textContent = 'Rp 0';
                    document.getElementById('totalBayar').textContent = 'Rp 0';
                    document.getElementById('checkoutBtn').style.display = 'none';
                }
            } catch (e) {
                container.innerHTML = '<p class="text-center text-danger">Gagal memuat keranjang.</p>';
            }
        }

        // Update quantity item
        async function updateQty(itemId, newQty, productId) {
            if (newQty < 1) {
                removeItem(itemId);
                return;
            }

            const data = await fetchAPI(`/keranjang/item/${itemId}`, {
                method: 'PUT',
                body: JSON.stringify({ quantity: newQty })
            });

            if (data.success) {
                loadCart(); // Reload keranjang
                updateCartCount();
            } else {
                showAlert(data.message || 'Gagal update quantity.', 'danger');
            }
        }

        // Hapus item dari keranjang
        async function removeItem(itemId) {
            const data = await fetchAPI(`/keranjang/item/${itemId}`, { method: 'DELETE' });
            if (data.success) {
                showAlert('Item dihapus dari keranjang.', 'info');
                loadCart();
                updateCartCount();
            }
        }

        // Kosongkan keranjang
        async function clearCart() {
            if (!confirm('Kosongkan semua item di keranjang?')) return;
            
            const data = await fetchAPI('/keranjang/clear', { method: 'DELETE' });
            if (data.success) {
                showAlert('Keranjang dikosongkan.', 'info');
                loadCart();
                updateCartCount();
            }
        }
    </script>
</body>
</html>
