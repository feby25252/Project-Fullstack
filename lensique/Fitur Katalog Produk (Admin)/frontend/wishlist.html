<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Saya - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== KONTEN WISHLIST ======== -->
    <div class="container py-4">
        <div class="card-container">
            <h3 class="mb-4"><i class="bi bi-heart" style="color: #E74C3C;"></i> Wishlist Saya</h3>
            <div class="row g-4" id="wishlistGrid">
                <div class="text-center py-5">
                    <div class="spinner-lensique"></div>
                    <p class="mt-3 text-muted">Memuat wishlist...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN WISHLIST
        // ============================================

        if (!isLoggedIn()) window.location.href = '/login';

        document.addEventListener('DOMContentLoaded', loadWishlist);

        async function loadWishlist() {
            const grid = document.getElementById('wishlistGrid');
            try {
                const data = await fetchAPI('/wishlist');
                if (data.success && data.data.length > 0) {
                    grid.innerHTML = data.data.map(item => `
                        <div class="col-6 col-md-4 col-lg-3" id="wishItem-${item.product_id}">
                            <div class="card card-product">
                                <img src="${item.image_url || '/public/img/no-image.svg'}" 
                                     class="card-img-top" alt="${item.name}"
                                     onerror="this.src='/public/img/no-image.svg'">
                                <div class="card-body">
                                    <span class="badge-category">${item.category_name || 'Umum'}</span>
                                    <h6 class="product-name mt-2">${item.name}</h6>
                                    <p class="product-price mb-1">${formatRupiah(item.base_price)}</p>
                                    <small class="product-stock mb-2 d-block">
                                        ${item.stock > 0 
                                            ? `<i class="bi bi-check-circle text-success"></i> Stok: ${item.stock}` 
                                            : '<i class="bi bi-x-circle text-danger"></i> Habis'}
                                    </small>
                                    <div class="d-flex gap-2">
                                        <a href="/produk/${item.product_id}" class="btn btn-lensique btn-sm flex-grow-1">
                                            <i class="bi bi-eye"></i> Detail
                                        </a>
                                        <button class="btn btn-outline-danger btn-sm" onclick="removeWishlist(${item.product_id})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-heart"></i>
                            <h4>Wishlist Kosong</h4>
                            <p>Belum ada produk di wishlist kamu.</p>
                            <a href="/katalog" class="btn btn-lensique mt-2">Jelajahi Katalog</a>
                        </div>
                    `;
                }
            } catch (e) {
                grid.innerHTML = '<p class="text-center text-danger">Gagal memuat wishlist.</p>';
            }
        }

        // Hapus item dari wishlist
        async function removeWishlist(productId) {
            const data = await fetchAPI('/wishlist/toggle', {
                method: 'POST',
                body: JSON.stringify({ product_id: productId })
            });

            if (data.success) {
                showAlert('Dihapus dari wishlist.', 'info');
                const el = document.getElementById(`wishItem-${productId}`);
                if (el) el.remove();

                // Cek apakah wishlist kosong
                const grid = document.getElementById('wishlistGrid');
                if (grid.children.length === 0) {
                    loadWishlist();
                }
            }
        }
    </script>
</body>
</html>
