<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-eyeglasses"></i> Lens<span>ique</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== KONTEN DETAIL PRODUK ======== -->
    <div class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" style="color: #C77986;">Home</a></li>
                <li class="breadcrumb-item"><a href="/katalog" style="color: #C77986;">Katalog</a></li>
                <li class="breadcrumb-item active" id="breadcrumbProduct">Detail Produk</li>
            </ol>
        </nav>

        <div id="productDetail">
            <div class="text-center py-5">
                <div class="spinner-lensique"></div>
                <p class="mt-3 text-muted">Memuat detail produk...</p>
            </div>
        </div>
    </div>

    <!-- Modal Review -->
    <div class="modal fade" id="reviewModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: 24px; border: none;">
                <div class="modal-header" style="border: none;">
                    <h5 class="modal-title"><i class="bi bi-star" style="color: #C77986;"></i> Tulis Review</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="reviewForm" class="form-lensique">
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="d-flex gap-2" id="ratingStars">
                                <i class="bi bi-star" data-rating="1" style="font-size: 1.8rem; cursor: pointer; color: #D5DBDB;"></i>
                                <i class="bi bi-star" data-rating="2" style="font-size: 1.8rem; cursor: pointer; color: #D5DBDB;"></i>
                                <i class="bi bi-star" data-rating="3" style="font-size: 1.8rem; cursor: pointer; color: #D5DBDB;"></i>
                                <i class="bi bi-star" data-rating="4" style="font-size: 1.8rem; cursor: pointer; color: #D5DBDB;"></i>
                                <i class="bi bi-star" data-rating="5" style="font-size: 1.8rem; cursor: pointer; color: #D5DBDB;"></i>
                            </div>
                            <input type="hidden" id="ratingValue" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Komentar</label>
                            <textarea class="form-control" id="reviewComment" rows="3" placeholder="Ceritakan pengalamanmu..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-lensique w-100">
                            <i class="bi bi-send"></i> Kirim Review
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN DETAIL PRODUK
        // ============================================

        let productId = null;
        let selectedRating = 0;
        let currentUserId = null;
        let userReview = null;

        document.addEventListener('DOMContentLoaded', () => {
            // Ambil ID produk dari URL
            const pathParts = window.location.pathname.split('/');
            productId = pathParts[pathParts.length - 1];

            const user = getUser();
            if (user) currentUserId = user.id;

            if (productId) {
                loadProductDetail(productId);
                loadReviews(productId);
            }

            // Setup rating stars
            setupRatingStars();
        });

        // Muat detail produk dari API
        async function loadProductDetail(id) {
            const container = document.getElementById('productDetail');
            try {
                const data = await fetchAPI(`/katalog/produk/${id}`);
                if (data.success) {
                    const p = data.data;
                    document.getElementById('breadcrumbProduct').textContent = p.name;
                    document.title = `${p.name} - Lensique`;

                    // Gambar utama dan galeri
                    const mainImage = p.images && p.images.length > 0 
                        ? p.images[0].image_url 
                        : '/public/img/no-image.svg';

                    const gallery = p.images && p.images.length > 1 
                        ? p.images.map((img, idx) => `
                            <img src="${img.image_url}" 
                                 class="rounded-3 me-2 mb-2 ${idx === 0 ? 'border border-2' : ''}" 
                                 style="width: 70px; height: 70px; object-fit: cover; cursor: pointer; border-color: var(--soft-pink) !important;"
                                 onclick="document.getElementById('mainImage').src='${img.image_url}'"
                                 onerror="this.style.display='none'">
                        `).join('') : '';

                    // Render bintang rata-rata rating
                    const stars = renderStars(p.avg_rating);

                    container.innerHTML = `
                        <div class="row">
                            <!-- Kolom Gambar -->
                            <div class="col-md-5 mb-4">
                                <div class="card-container p-3">
                                    <img src="${mainImage}" id="mainImage"
                                         class="w-100 rounded-3" 
                                         style="max-height: 400px; object-fit: cover;"
                                         alt="${p.name}"
                                         onerror="this.src='/public/img/no-image.svg'">
                                    <div class="mt-3 d-flex flex-wrap">
                                        ${gallery}
                                    </div>
                                </div>
                            </div>

                            <!-- Kolom Info -->
                            <div class="col-md-7">
                                <div class="card-container">
                                    <span class="badge-category">${p.category_name || 'Umum'}</span>
                                    <h2 class="mt-2 fw-bold">${p.name}</h2>
                                    
                                    <div class="d-flex align-items-center gap-2 mb-3">
                                        ${stars}
                                        <span class="text-muted">(${p.review_count} review)</span>
                                    </div>

                                    <h3 class="fw-bold mb-3" style="color: #C77986;">${formatRupiah(p.base_price)}</h3>

                                    <div class="mb-3">
                                        <span class="${p.stock > 0 ? 'text-success' : 'text-danger'}">
                                            <i class="bi ${p.stock > 0 ? 'bi-check-circle-fill' : 'bi-x-circle-fill'}"></i>
                                            ${p.stock > 0 ? `Stok tersedia: ${p.stock}` : 'Stok habis'}
                                        </span>
                                    </div>

                                    <div class="mb-3">
                                        <h6 class="fw-bold">Deskripsi</h6>
                                        <p class="text-muted">${p.description || 'Tidak ada deskripsi.'}</p>
                                    </div>

                                    ${p.stock > 0 && isLoggedIn() ? `
                                    <div class="d-flex align-items-center gap-3 mb-3">
                                        <label class="fw-bold">Jumlah:</label>
                                        <div class="qty-control">
                                            <button type="button" onclick="changeQty(-1)">-</button>
                                            <input type="number" id="qty" value="1" min="1" max="${p.stock}" readonly>
                                            <button type="button" onclick="changeQty(1)">+</button>
                                        </div>
                                    </div>

                                    <div class="d-flex gap-2">
                                        <button class="btn btn-lensique flex-grow-1" onclick="addToCartDetail()">
                                            <i class="bi bi-cart-plus"></i> Tambah ke Keranjang
                                        </button>
                                        <button class="btn btn-lensique-outline" onclick="toggleWishlistDetail()">
                                            <i class="bi bi-heart" id="wishlistIcon"></i>
                                        </button>
                                    </div>
                                    ` : !isLoggedIn() ? `
                                    <a href="/login" class="btn btn-lensique w-100">
                                        <i class="bi bi-box-arrow-in-right"></i> Login untuk Membeli
                                    </a>
                                    ` : `
                                    <button class="btn btn-secondary w-100" disabled>
                                        <i class="bi bi-x-circle"></i> Stok Habis
                                    </button>
                                    `}
                                </div>
                            </div>
                        </div>

                        <!-- Review Section -->
                        <div class="card-container mt-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h4><i class="bi bi-chat-dots" style="color: #C77986;"></i> Review Produk</h4>
                                ${isLoggedIn() && !userReview ? `
                                <button class="btn btn-lensique-outline btn-sm" data-bs-toggle="modal" data-bs-target="#reviewModal">
                                    <i class="bi bi-plus"></i> Tulis Review
                                </button>
                                ` : ''}
                            </div>

                            <div id="reviewList">
                                <p class="text-muted text-center">Memuat review...</p>
                            </div>
                        </div>
                    `;

                    // Cek status wishlist jika login
                    if (isLoggedIn()) {
                        checkWishlistStatus(id);
                    }

                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-exclamation-circle"></i>
                            <h4>Produk Tidak Ditemukan</h4>
                            <p>Produk yang Anda cari tidak tersedia.</p>
                            <a href="/katalog" class="btn btn-lensique">Kembali ke Katalog</a>
                        </div>
                    `;
                }
            } catch (e) {
                container.innerHTML = '<p class="text-center text-danger">Gagal memuat produk.</p>';
            }
        }

        // Render bintang rating
        function renderStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.floor(rating)) {
                    stars += '<i class="bi bi-star-fill" style="color: #F9E79F;"></i>';
                } else if (i === Math.ceil(rating) && rating % 1 !== 0) {
                    stars += '<i class="bi bi-star-half" style="color: #F9E79F;"></i>';
                } else {
                    stars += '<i class="bi bi-star" style="color: #D5DBDB;"></i>';
                }
            }
            return stars;
        }

        // Ubah quantity
        function changeQty(delta) {
            const input = document.getElementById('qty');
            let val = parseInt(input.value) + delta;
            val = Math.max(1, Math.min(val, parseInt(input.max)));
            input.value = val;
        }

        // Tambah ke keranjang dari halaman detail
        async function addToCartDetail() {
            const qty = parseInt(document.getElementById('qty').value);
            const data = await fetchAPI('/keranjang/tambah', {
                method: 'POST',
                body: JSON.stringify({ product_id: productId, quantity: qty })
            });

            if (data.success) {
                showAlert(`${qty} item ditambahkan ke keranjang!`, 'success');
                updateCartCount();
            } else {
                showAlert(data.message || 'Gagal menambahkan ke keranjang.', 'danger');
            }
        }

        // Toggle wishlist dari detail
        async function toggleWishlistDetail() {
            const data = await fetchAPI('/wishlist/toggle', {
                method: 'POST',
                body: JSON.stringify({ product_id: parseInt(productId) })
            });

            if (data.success) {
                const icon = document.getElementById('wishlistIcon');
                if (data.action === 'added') {
                    icon.classList.replace('bi-heart', 'bi-heart-fill');
                    icon.style.color = '#E74C3C';
                    showAlert('Ditambahkan ke wishlist!', 'success');
                } else {
                    icon.classList.replace('bi-heart-fill', 'bi-heart');
                    icon.style.color = '';
                    showAlert('Dihapus dari wishlist.', 'info');
                }
            }
        }

        // Cek status wishlist
        async function checkWishlistStatus(id) {
            const data = await fetchAPI(`/wishlist/check/${id}`);
            if (data.success && data.isWishlisted) {
                const icon = document.getElementById('wishlistIcon');
                if (icon) {
                    icon.classList.replace('bi-heart', 'bi-heart-fill');
                    icon.style.color = '#E74C3C';
                }
            }
        }

        // Setup rating stars di modal review
        function setupRatingStars() {
            document.getElementById('ratingStars').addEventListener('click', (e) => {
                if (e.target.matches('[data-rating]')) {
                    selectedRating = parseInt(e.target.dataset.rating);
                    document.getElementById('ratingValue').value = selectedRating;

                    // Update tampilan bintang
                    document.querySelectorAll('#ratingStars i').forEach((star, idx) => {
                        if (idx < selectedRating) {
                            star.classList.replace('bi-star', 'bi-star-fill');
                            star.style.color = '#F9E79F';
                        } else {
                            star.classList.replace('bi-star-fill', 'bi-star');
                            star.style.color = '#D5DBDB';
                        }
                    });
                }
            });
        }

        // Muat review dari API
        async function loadReviews(id) {
            const container = document.getElementById('reviewList');
            try {
                const data = await fetchAPI(`/products/${id}/reviews`);
                if (data.success) {
                    const reviews = data.data.reviews;
                    const avg = data.data.avg_rating;
                    const total = data.data.total_reviews;

                    // Cek apakah user sudah review
                    if (currentUserId && reviews) {
                        userReview = reviews.find(r => r.user_id === currentUserId);
                    }

                    // Update badge rating di header produk jika ada
                    const ratingEl = document.querySelector('.product-rating-summary');
                    if (ratingEl) {
                        ratingEl.innerHTML = `${renderStars(avg)} <span class="text-muted">(${total} review)</span>`;
                    }

                    if (reviews.length === 0) {
                        container.innerHTML = '<p class="text-muted text-center">Belum ada review.</p>';
                        return;
                    }

                    container.innerHTML = reviews.map(r => `
                        <div class="d-flex gap-3 mb-3 pb-3 border-bottom" style="border-color: var(--border-color) !important;" id="review-${r.id}">
                            <div>
                                <img src="${r.avatar_url || '/public/img/default-avatar.svg'}" 
                                     class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;"
                                     onerror="this.src='/public/img/default-avatar.svg'">
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <strong>${r.username}</strong>
                                    ${r.user_id === currentUserId ? `
                                    <div class="dropdown">
                                        <button class="btn btn-sm btn-link text-muted" data-bs-toggle="dropdown"><i class="bi bi-three-dots-vertical"></i></button>
                                        <ul class="dropdown-menu dropdown-menu-end">
                                            <li><a class="dropdown-item" href="#" onclick="editReview(${r.id}, ${r.rating}, '${escapeHtml(r.comment || '')}'); return false;"><i class="bi bi-pencil"></i> Edit</a></li>
                                            <li><a class="dropdown-item text-danger" href="#" onclick="deleteReview(${r.id}); return false;"><i class="bi bi-trash"></i> Hapus</a></li>
                                        </ul>
                                    </div>
                                    ` : ''}
                                </div>
                                <div>${renderStars(r.rating)}</div>
                                <p class="text-muted mb-0">${escapeHtml(r.comment || '')}</p>
                                <small class="text-muted">${formatTanggal(r.created_at)}${r.updated_at !== r.created_at ? ' (diedit)' : ''}</small>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-muted text-center">Gagal memuat review.</p>';
                }
            } catch (e) {
                container.innerHTML = '<p class="text-muted text-center">Gagal memuat review.</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Submit review
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = parseInt(document.getElementById('ratingValue').value);
            const comment = document.getElementById('reviewComment').value;

            if (rating === 0) {
                showAlert('Pilih rating terlebih dahulu.', 'danger');
                return;
            }

            const data = await fetchAPI(`/reviews`, {
                method: 'POST',
                body: JSON.stringify({ product_id: parseInt(productId), rating, comment })
            });

            if (data.success) {
                showAlert('Review berhasil ditambahkan!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
                document.getElementById('reviewComment').value = '';
                document.getElementById('ratingValue').value = '0';
                selectedRating = 0;
                document.querySelectorAll('#ratingStars i').forEach(star => {
                    star.classList.replace('bi-star-fill', 'bi-star');
                    star.style.color = '#D5DBDB';
                });
                loadReviews(productId);
                loadProductDetail(productId);
            } else {
                showAlert(data.message || 'Gagal menambah review.', 'danger');
            }
        });

        // Edit review
        async function editReview(id, currentRating, currentComment) {
            const newRating = prompt('Rating baru (1-5):', currentRating);
            if (newRating === null) return;
            const rating = parseInt(newRating);
            if (isNaN(rating) || rating < 1 || rating > 5) {
                showAlert('Rating tidak valid.', 'danger');
                return;
            }
            const comment = prompt('Komentar baru:', currentComment);
            if (comment === null) return;

            const data = await fetchAPI(`/reviews/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ rating, comment })
            });

            if (data.success) {
                showAlert('Review berhasil diperbarui!', 'success');
                loadReviews(productId);
            } else {
                showAlert(data.message || 'Gagal memperbarui review.', 'danger');
            }
        }

        // Hapus review
        async function deleteReview(id) {
            if (!confirm('Yakin ingin menghapus review ini?')) return;
            const data = await fetchAPI(`/reviews/${id}`, { method: 'DELETE' });
            if (data.success) {
                showAlert('Review berhasil dihapus!', 'success');
                loadReviews(productId);
                loadProductDetail(productId);
            } else {
                showAlert(data.message || 'Gagal menghapus review.', 'danger');
            }
        }
    </script>
</body>
</html>
