<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- ======== NAVBAR ======== -->
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-eyeglasses"></i> Lens<span>ique</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <!-- ======== FORM REGISTER ======== -->
    <div class="container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="bi bi-eyeglasses"></i> Lensique
            </div>
            <h2>Buat Akun Baru</h2>
            <p class="auth-subtitle">Bergabung dengan Lensique untuk pengalaman belanja terbaik!</p>

            <form id="registerForm" class="form-lensique">
                <!-- Input Nama Lengkap -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        <i class="bi bi-person"></i> Nama Lengkap
                    </label>
                    <input type="text" class="form-control" id="full_name" 
                           placeholder="Masukkan nama lengkap" required>
                </div>

                <!-- Input Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-at"></i> Username
                    </label>
                    <input type="text" class="form-control" id="username" 
                           placeholder="Pilih username" required>
                </div>

                <!-- Input Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope"></i> Email
                    </label>
                    <input type="email" class="form-control" id="email" 
                           placeholder="contoh@email.com" required>
                </div>

                <!-- Input Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" 
                               placeholder="Minimal 6 karakter" required minlength="6"
                               style="border-radius: 15px 0 0 15px;">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                style="border-radius: 0 15px 15px 0; border-color: var(--border-color);">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Input Konfirmasi Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        <i class="bi bi-lock-fill"></i> Konfirmasi Password
                    </label>
                    <input type="password" class="form-control" id="confirmPassword" 
                           placeholder="Ulangi password" required minlength="6">
                </div>

                <!-- Tombol Register -->
                <button type="submit" class="btn btn-lensique w-100 mb-3" id="registerBtn">
                    <i class="bi bi-person-plus"></i> Daftar
                </button>

                <!-- Link ke halaman login -->
                <p class="text-center mb-0">
                    Sudah punya akun? 
                    <a href="/login" style="color: #C77986; font-weight: 600;">Login di sini</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        // ============================================
        // SCRIPT HALAMAN REGISTER
        // ============================================

        // Toggle tampilkan/sembunyikan password
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const icon = this.querySelector('i');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Redirect jika sudah login
        if (isLoggedIn()) {
            window.location.href = '/';
        }

        // Handle submit form registrasi
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validasi password cocok
            if (password !== confirmPassword) {
                showAlert('Password dan konfirmasi password tidak cocok!', 'danger');
                return;
            }

            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<div class="spinner-border spinner-border-sm me-2"></div> Memproses...';

            const formData = {
                full_name: document.getElementById('full_name').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password
            };

            try {
                const data = await fetchAPI('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                if (data.success) {
                    showAlert('Registrasi berhasil! Mengalihkan ke halaman login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Registrasi gagal.', 'danger');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Daftar';
                }
            } catch (error) {
                showAlert('Terjadi kesalahan koneksi.', 'danger');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Daftar';
            }
        });
    </script>
</body>
</html>
