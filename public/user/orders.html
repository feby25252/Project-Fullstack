<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
    <style>
        .order-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .status-pill { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .sp-order { background: var(--soft-pink); color: #C0392B; }
        .sp-paid { background: var(--soft-green); color: #27AE60; }
        .sp-process { background: var(--baby-blue); color: #2874A6; }
        .sp-packed { background: var(--soft-purple); color: #8E44AD; }
        .sp-shipped { background: #D5DBDB; color: #2C3E50; }
        .sp-delivered { background: var(--soft-green); color: #1E8449; }
        .sp-cancelled { background: #F5B7B1; color: #922B21; }
        .pay-pending { background: var(--soft-yellow); color: #D68910; }
        .pay-paid { background: var(--soft-green); color: #27AE60; }
        .pay-failed { background: var(--soft-pink); color: #C0392B; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="bi bi-receipt" style="color: #C77986;"></i> Riwayat Pesanan</h3>
            <select class="form-select" id="statusFilter" style="width: auto; border-radius: 15px;" onchange="loadOrders(1)">
                <option value="">Semua Status</option>
                <option value="pending">Menunggu</option>
                <option value="processing">Diproses</option>
                <option value="shipped">Dikirim</option>
                <option value="delivered">Selesai</option>
                <option value="cancelled">Dibatalkan</option>
            </select>
        </div>

        <div id="orderList">
            <div class="text-center py-5">
                <div class="spinner-lensique"></div>
                <p class="mt-3 text-muted">Memuat pesanan...</p>
            </div>
        </div>

        <nav class="mt-3">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';

        document.addEventListener('DOMContentLoaded', loadOrders);

        function getStatusPill(status) {
            const map = {
                'pending': { cls: 'sp-order', text: 'Menunggu' },
                'paid': { cls: 'sp-paid', text: 'Lunas' },
                'processing': { cls: 'sp-process', text: 'Diproses' },
                'packed': { cls: 'sp-packed', text: 'Dikemas' },
                'shipped': { cls: 'sp-shipped', text: 'Dikirim' },
                'delivered': { cls: 'sp-delivered', text: 'Selesai' },
                'cancelled': { cls: 'sp-cancelled', text: 'Dibatalkan' }
            };
            const s = map[status] || { cls: 'sp-order', text: status };
            return `<span class="status-pill ${s.cls}">${s.text}</span>`;
        }

        function getPaymentPill(status) {
            if (!status || status === 'pending') return `<span class="status-pill pay-pending">Belum Dibayar</span>`;
            if (status === 'paid') return `<span class="status-pill pay-paid">Lunas</span>`;
            if (status === 'failed') return `<span class="status-pill pay-failed">Gagal</span>`;
            return `<span class="status-pill pay-pending">${status}</span>`;
        }

        async function loadOrders(page = 1) {
            const container = document.getElementById('orderList');
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-lensique"></div><p class="mt-3 text-muted">Memuat pesanan...</p></div>';

            const status = document.getElementById('statusFilter').value;
            let url = `/orders/history?page=${page}&limit=10`;
            if (status) url += `&status=${status}`;

            try {
                const data = await fetchAPI(url);
                if (data.success && data.data.length > 0) {
                    container.innerHTML = data.data.map(order => `
                        <div class="order-card" onclick="window.location.href='/user/orders/${order.id}'">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div>
                                    <h6 class="fw-bold mb-1">${order.order_number}</h6>
                                    <small class="text-muted"><i class="bi bi-calendar3"></i> ${formatTanggal(order.created_at)}</small>
                                </div>
                                <div class="text-end">
                                    ${getStatusPill(order.status)}
                                    <p class="fw-bold mt-1 mb-0" style="color: #C77986;">${formatRupiah(order.total_amount)}</p>
                                </div>
                            </div>
                            <div class="mt-2 d-flex flex-wrap gap-3">
                                <small class="text-muted"><i class="bi bi-box-seam"></i> ${order.item_count} item</small>
                                <small class="text-muted"><i class="bi bi-wallet2"></i> ${order.payment_method || '-'}</small>
                                <small class="text-muted"><i class="bi bi-credit-card"></i> ${getPaymentPill(order.payment_status)}</small>
                                ${order.tracking_number ? `<small class="text-muted"><i class="bi bi-truck"></i> Resi: ${order.tracking_number}</small>` : ''}
                            </div>
                            ${getProgress(order.status)}
                        </div>
                    `).join('');

                    const { page: currentPage, totalPages } = data.pagination;
                    const pag = document.getElementById('pagination');
                    if (totalPages > 1) {
                        let html = '';
                        for (let i = 1; i <= totalPages; i++) {
                            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                                <a class="page-link" href="#" onclick="loadOrders(${i}); return false;"
                                   style="${i === currentPage ? 'background: var(--soft-pink); border-color: var(--soft-pink); color: var(--dark-text);' : ''}">${i}</a>
                            </li>`;
                        }
                        pag.innerHTML = html;
                    } else {
                        pag.innerHTML = '';
                    }
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-receipt"></i>
                            <h4>Belum Ada Riwayat Pesanan</h4>
                            <p>Kamu belum memiliki riwayat pesanan.</p>
                            <a href="/katalog" class="btn btn-lensique mt-2">Mulai Belanja</a>
                        </div>
                    `;
                    document.getElementById('pagination').innerHTML = '';
                }
            } catch (e) {
                container.innerHTML = '<p class="text-center text-danger">Gagal memuat pesanan.</p>';
            }
        }

        function getProgress(status) {
            if (status === 'cancelled') {
                return '<div class="mt-2"><span class="badge bg-danger">Pesanan Dibatalkan</span></div>';
            }
            const steps = [
                { key: 'pending', label: 'Dipesan' },
                { key: 'processing', label: 'Diproses' },
                { key: 'shipped', label: 'Dikirim' },
                { key: 'delivered', label: 'Selesai' }
            ];
            const idx = steps.findIndex(s => s.key === status);
            if (idx === -1) return '';
            const pct = ((idx + 1) / steps.length) * 100;
            return `
                <div class="mt-3">
                    <div class="progress" style="height: 8px; border-radius: 10px;">
                        <div class="progress-bar" role="progressbar" style="width: ${pct}%; background: linear-gradient(90deg, #C77986, #5DADE2);"></div>
                    </div>
                    <div class="d-flex justify-content-between mt-1">
                        ${steps.map((s, i) => `<small class="${i <= idx ? 'fw-bold text-dark' : 'text-muted'}" style="font-size:11px">${s.label}</small>`).join('')}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
