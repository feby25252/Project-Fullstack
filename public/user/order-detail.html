<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pesanan - Lensique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/public/css/style.css" rel="stylesheet">
    <style>
        .timeline { position: relative; padding-left: 28px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: #E8E8E8; }
        .timeline-item { position: relative; margin-bottom: 18px; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #E8E8E8; border: 2px solid #fff; box-shadow: 0 0 0 2px #E8E8E8; }
        .timeline-item.done::before { background: #27AE60; box-shadow: 0 0 0 2px #27AE60; }
        .timeline-item.active::before { background: var(--soft-yellow); box-shadow: 0 0 0 2px var(--soft-yellow); }
        .info-box { background: #FAFAFA; border-radius: 16px; padding: 16px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-lensique sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-eyeglasses"></i> Lens<span>ique</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navbarRight"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="/user/orders" class="btn btn-sm btn-outline-secondary rounded-pill"><i class="bi bi-arrow-left"></i> Kembali</a>
            <h4 class="mb-0">Detail Pesanan</h4>
        </div>

        <div id="orderDetail">
            <div class="text-center py-5">
                <div class="spinner-lensique"></div>
                <p class="mt-3 text-muted">Memuat detail pesanan...</p>
            </div>
        </div>
    </div>

    <footer class="footer-lensique">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Lensique. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/public/js/app.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';

        const orderId = window.location.pathname.split('/').pop();

        async function loadOrderDetail() {
            const container = document.getElementById('orderDetail');
            try {
                const data = await fetchAPI(`/orders/${orderId}`);
                if (!data.success) {
                    container.innerHTML = `<p class="text-center text-danger">${data.message}</p>`;
                    return;
                }

                const o = data.data;
                const steps = [
                    { key: 'pending', label: 'Pesanan Dibuat', desc: 'Pesanan telah diterima' },
                    { key: 'paid', label: 'Pembayaran Diterima', desc: 'Pembayaran telah dikonfirmasi' },
                    { key: 'processing', label: 'Sedang Diproses', desc: 'Pesanan sedang disiapkan' },
                    { key: 'packed', label: 'Dikemas', desc: 'Pesanan sedang dikemas' },
                    { key: 'shipped', label: 'Dikirim', desc: 'Pesanan dalam perjalanan' },
                    { key: 'delivered', label: 'Selesai', desc: 'Pesanan telah diterima' }
                ];
                const currentIdx = steps.findIndex(s => s.key === (o.order_status || o.status));

                const statusBadge = getStatusBadge(o.status);
                const paymentBadge = o.payment ? getPaymentBadge(o.payment.payment_status) : '<span class="badge bg-warning text-dark">Belum Dibayar</span>';

                container.innerHTML = `
                    <div class="row g-4">
                        <div class="col-lg-8">
                            <div class="card-container mb-4">
                                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                    <div>
                                        <h5 class="fw-bold mb-1">${o.order_number}</h5>
                                        <small class="text-muted"><i class="bi bi-calendar3"></i> ${formatTanggal(o.created_at)}</small>
                                    </div>
                                    <div>${statusBadge}</div>
                                </div>
                                <hr style="border-color: var(--border-color);">
                                <h6 class="fw-bold mb-3">Status Pesanan</h6>
                                <div class="timeline">
                                    ${steps.map((s, i) => `
                                        <div class="timeline-item ${i < currentIdx ? 'done' : i === currentIdx ? 'active' : ''}">
                                            <strong>${s.label}</strong>
                                            <p class="text-muted mb-0 small">${s.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="card-container mb-4">
                                <h6 class="fw-bold mb-3">Item Pesanan</h6>
                                ${o.items.map(item => `
                                    <div class="d-flex gap-3 mb-3 pb-3 border-bottom" style="border-color: var(--border-color) !important;">
                                        <img src="${item.image_url || '/public/img/no-image.svg'}" 
                                             class="rounded-3" style="width: 60px; height: 60px; object-fit: cover;"
                                             onerror="this.src='/public/img/no-image.svg'">
                                        <div class="flex-grow-1">
                                            <div class="fw-bold">${item.name}</div>
                                            <small class="text-muted">${item.quantity}x ${formatRupiah(item.price)}</small>
                                        </div>
                                        <div class="fw-bold">${formatRupiah(item.subtotal)}</div>
                                    </div>
                                `).join('')}
                                <div class="d-flex justify-content-between pt-2">
                                    <strong>Total</strong>
                                    <strong style="color: #C77986; font-size: 1.2rem;">${formatRupiah(o.total_amount)}</strong>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="info-box mb-3">
                                <h6 class="fw-bold mb-2"><i class="bi bi-credit-card" style="color: #A569BD;"></i> Pembayaran</h6>
                                <div class="d-flex justify-content-between mb-1">
                                    <small class="text-muted">Metode</small>
                                    <small>${o.payment_method || '-'}</small>
                                </div>
                                <div class="d-flex justify-content-between mb-1">
                                    <small class="text-muted">Status</small>
                                    <small>${paymentBadge}</small>
                                </div>
                                ${o.payment && o.payment.verified_at ? `
                                <div class="d-flex justify-content-between">
                                    <small class="text-muted">Verifikasi</small>
                                    <small>${formatTanggal(o.payment.verified_at)}</small>
                                </div>
                                ` : ''}
                            </div>

                            <div class="info-box mb-3">
                                <h6 class="fw-bold mb-2"><i class="bi bi-truck" style="color: #5DADE2;"></i> Pengiriman</h6>
                                <div class="d-flex justify-content-between mb-1">
                                    <small class="text-muted">Kurir</small>
                                    <small>${o.shipping?.courier || '-'}</small>
                                </div>
                                <div class="d-flex justify-content-between mb-1">
                                    <small class="text-muted">Status</small>
                                    <small>${getShippingBadge(o.shipping?.shipping_status)}</small>
                                </div>
                                ${o.shipping?.tracking_number ? `
                                <div class="d-flex justify-content-between">
                                    <small class="text-muted">Resi</small>
                                    <small class="fw-bold">${o.shipping.tracking_number}</small>
                                </div>
                                ` : ''}
                            </div>

                            <div class="info-box">
                                <h6 class="fw-bold mb-2"><i class="bi bi-geo-alt" style="color: #C77986;"></i> Alamat Pengiriman</h6>
                                <p class="mb-0 small">${o.shipping_address || '-'}</p>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = '<p class="text-center text-danger">Gagal memuat detail pesanan.</p>';
            }
        }

        function getPaymentBadge(status) {
            if (!status || status === 'pending') return '<span class="badge bg-warning text-dark">Belum Dibayar</span>';
            if (status === 'paid') return '<span class="badge bg-success">Lunas</span>';
            if (status === 'failed') return '<span class="badge bg-danger">Gagal</span>';
            return '<span class="badge bg-secondary">' + status + '</span>';
        }

        function getShippingBadge(status) {
            if (!status || status === 'waiting' || status === 'pending') return '<span class="badge bg-warning text-dark">Menunggu</span>';
            if (status === 'sent' || status === 'shipped' || status === 'in_transit') return '<span class="badge bg-info">Dikirim</span>';
            if (status === 'received' || status === 'delivered') return '<span class="badge bg-success">Diterima</span>';
            return '<span class="badge bg-secondary">' + status + '</span>';
        }

        loadOrderDetail();
    </script>
</body>
</html>
