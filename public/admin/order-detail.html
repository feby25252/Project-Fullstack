<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pesanan - Lensique Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <style>
        .timeline { position: relative; padding-left: 24px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: #E8E8E8; }
        .timeline-item { position: relative; margin-bottom: 16px; }
        .timeline-item::before { content: ''; position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--soft-purple); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--soft-purple); }
        .timeline-item.active::before { background: #27AE60; box-shadow: 0 0 0 2px #27AE60; }
        .timeline-item.pending::before { background: var(--soft-yellow); box-shadow: 0 0 0 2px var(--soft-yellow); }
        .status-select { padding: 8px 14px; border: 2px solid #E8E8E8; border-radius: 12px; font-size: 14px; width: 100%; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F5F5F5; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); font-size: 14px; }
        .info-value { font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-header">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <h1>Detail Pesanan</h1>
                        <p id="orderNumber">Memuat data...</p>
                    </div>
                    <button class="btn btn-sm" onclick="window.location.href='/admin/orders'" style="background:#fff;border:2px solid #E8E8E8">
                        <i class="bi bi-arrow-left"></i> Kembali
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <!-- Kolom Kiri: Info Pesanan & Timeline -->
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h3><i class="bi bi-box-seam"></i> Item Pesanan</h3>
                        </div>
                        <div class="table-responsive" id="itemsTable">
                            <p class="loading">Memuat item...</p>
                        </div>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header">
                            <h3><i class="bi bi-truck"></i> Status Pengiriman</h3>
                        </div>
                        <div class="p-3">
                            <div class="timeline" id="shippingTimeline">
                                <div class="timeline-item pending">
                                    <strong>Menunggu</strong>
                                    <p class="text-muted mb-0 small">Pesanan menunggu konfirmasi</p>
                                </div>
                                <div class="timeline-item">
                                    <strong>Diproses</strong>
                                    <p class="text-muted mb-0 small">Pesanan sedang diproses</p>
                                </div>
                                <div class="timeline-item">
                                    <strong>Dikemas</strong>
                                    <p class="text-muted mb-0 small">Pesanan sedang dikemas</p>
                                </div>
                                <div class="timeline-item">
                                    <strong>Dikirim</strong>
                                    <p class="text-muted mb-0 small">Pesanan dalam perjalanan</p>
                                </div>
                                <div class="timeline-item">
                                    <strong>Diterima</strong>
                                    <p class="text-muted mb-0 small">Pesanan telah diterima</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kolom Kanan: Update Status -->
                <div class="col-lg-4">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h3><i class="bi bi-pencil-square"></i> Update Status</h3>
                        </div>
                        <div class="p-3">
                            <div class="mb-3">
                                <label class="form-label">Status Pesanan</label>
                                <select class="status-select" id="orderStatus">
                                    <option value="pending">Pending</option>
                                    <option value="paid">Paid</option>
                                    <option value="processing">Processing</option>
                                    <option value="packed">Packed</option>
                                    <option value="shipped">Shipped</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status Pembayaran</label>
                                <select class="status-select" id="paymentStatus">
                                    <option value="pending">Unpaid</option>
                                    <option value="paid">Paid</option>
                                    <option value="failed">Failed</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status Pengiriman</label>
                                <select class="status-select" id="shippingStatus">
                                    <option value="waiting">Waiting</option>
                                    <option value="sent">Sent</option>
                                    <option value="received">Received</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nomor Resi</label>
                                <input type="text" class="status-select" id="trackingNumber" placeholder="Masukkan nomor resi">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Kurir</label>
                                <input type="text" class="status-select" id="courier" placeholder="Nama kurir">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Catatan Admin</label>
                                <textarea class="status-select" id="adminNotes" rows="2" placeholder="Catatan internal..."></textarea>
                            </div>

                            <button class="btn btn-primary w-100" onclick="updateStatus()">
                                <i class="bi bi-check-circle"></i> Simpan Perubahan
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3><i class="bi bi-info-circle"></i> Informasi</h3>
                        </div>
                        <div class="p-3" id="orderInfo">
                            <p class="loading">Memuat...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        if (!requireAuth()) {}
        renderSidebar('orders');

        const orderId = window.location.pathname.split('/').pop();
        let orderData = null;

        async function loadOrderDetail() {
            try {
                const data = await apiGet(`/api/admin/orders/${orderId}`);
                if (!data.success) {
                    showAlert('Gagal memuat pesanan: ' + data.message);
                    return;
                }

                orderData = data.data;
                document.getElementById('orderNumber').innerHTML = `
                    <strong>${orderData.order_number}</strong> &bull; ${formatDate(orderData.created_at)}
                `;

                // Render items
                const itemsHtml = `
                    <table>
                        <thead>
                            <tr><th>Produk</th><th>Harga</th><th>Qty</th><th>Subtotal</th></tr>
                        </thead>
                        <tbody>
                            ${orderData.items.map(item => `
                                <tr>
                                    <td>
                                        <div style="display:flex;align-items:center;gap:10px">
                                            <img src="${item.image_url || '/public/img/no-image.svg'}" 
                                                 style="width:40px;height:40px;object-fit:cover;border-radius:8px"
                                                 onerror="this.src='/public/img/no-image.svg'">
                                            <span>${item.name}</span>
                                        </div>
                                    </td>
                                    <td>${formatRupiah(item.price)}</td>
                                    <td>${item.quantity}</td>
                                    <td class="fw-bold">${formatRupiah(item.subtotal)}</td>
                                </tr>
                            `).join('')}
                            <tr style="background:#FAFAFA">
                                <td colspan="3" class="text-end fw-bold">Total:</td>
                                <td class="fw-bold" style="color:#C77986;font-size:1.1rem">${formatRupiah(orderData.total_amount)}</td>
                            </tr>
                        </tbody>
                    </table>
                `;
                document.getElementById('itemsTable').innerHTML = itemsHtml;

                // Set form values
                document.getElementById('orderStatus').value = orderData.order_status || orderData.status || 'pending';
                document.getElementById('paymentStatus').value = orderData.payment?.payment_status || 'pending';
                document.getElementById('shippingStatus').value = orderData.shipping?.shipping_status || 'waiting';
                document.getElementById('trackingNumber').value = orderData.shipping?.tracking_number || '';
                document.getElementById('courier').value = orderData.shipping?.courier || '';
                document.getElementById('adminNotes').value = orderData.shipping?.admin_notes || '';

                // Render info
                document.getElementById('orderInfo').innerHTML = `
                    <div class="info-row"><span class="info-label">Customer</span><span class="info-value">${orderData.username || '-'}</span></div>
                    <div class="info-row"><span class="info-label">Email</span><span class="info-value">${orderData.email || '-'}</span></div>
                    <div class="info-row"><span class="info-label">Metode Bayar</span><span class="info-value">${orderData.payment_method || '-'}</span></div>
                    <div class="info-row"><span class="info-label">Status Bayar</span><span class="info-value">${orderData.payment?.payment_status || 'pending'}</span></div>
                    <div class="info-row"><span class="info-label">Kurir</span><span class="info-value">${orderData.shipping?.courier || '-'}</span></div>
                    <div class="info-row"><span class="info-label">Resi</span><span class="info-value">${orderData.shipping?.tracking_number || '-'}</span></div>
                    <div class="info-row"><span class="info-label">Alamat</span><span class="info-value" style="text-align:right;max-width:60%">${orderData.shipping_address || '-'}</span></div>
                `;

                // Update timeline active states
                const statusOrder = ['pending', 'paid', 'processing', 'packed', 'shipped', 'delivered'];
                const currentStatus = orderData.order_status || orderData.status || 'pending';
                const currentIdx = statusOrder.indexOf(currentStatus);
                const timelineItems = document.querySelectorAll('.timeline-item');
                timelineItems.forEach((item, idx) => {
                    if (idx <= currentIdx && currentIdx >= 0) {
                        item.classList.add('active');
                        item.classList.remove('pending');
                    }
                });

            } catch (err) {
                showAlert('Gagal memuat detail pesanan: ' + err.message);
            }
        }

        async function updateStatus() {
            const payload = {
                order_status: document.getElementById('orderStatus').value,
                payment_status: document.getElementById('paymentStatus').value,
                shipping_status: document.getElementById('shippingStatus').value,
                tracking_number: document.getElementById('trackingNumber').value,
                courier: document.getElementById('courier').value,
                admin_notes: document.getElementById('adminNotes').value
            };

            try {
                await apiPut(`/api/admin/orders/${orderId}/status`, payload);
                showAlert('Status pesanan berhasil diperbarui!', 'success');
                loadOrderDetail();
            } catch (err) {
                showAlert('Gagal memperbarui status: ' + err.message);
            }
        }

        loadOrderDetail();
    </script>
</body>
</html>
