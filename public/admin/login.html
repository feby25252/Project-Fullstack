<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Lensique</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">👓</div>
            <h1>Admin Lensique</h1>
            <p class="subtitle">Masuk ke panel admin</p>

            <div id="alert-box" class="alert alert-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="admin@lensique.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-primary">Masuk</button>
            </form>
        </div>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        // Redirect jika sudah login
        requireGuest();

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert('alert-box');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('alert-box', 'Email dan password wajib diisi.');
                return;
            }

            // Disable button while processing
            const btn = this.querySelector('button[type="submit"]');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!data.success) {
                    showAlert('alert-box', data.message || 'Login gagal.');
                    btn.disabled = false;
                    btn.textContent = origText;
                    return;
                }

                // Cek apakah admin
                if (!data.data || !data.data.user || data.data.user.role_id !== 1) {
                    showAlert('alert-box', 'Akses ditolak. Hanya admin yang dapat masuk.');
                    btn.disabled = false;
                    btn.textContent = origText;
                    return;
                }

                // Clear any stale data first
                removeToken();

                // Simpan token dan user
                setToken(data.data.token);
                setUser(data.data.user);

                // Verify storage was successful
                if (!getToken() || !getUser()) {
                    showAlert('alert-box', 'Gagal menyimpan sesi. Coba lagi.');
                    btn.disabled = false;
                    btn.textContent = origText;
                    return;
                }

                window.location.replace('/admin/dashboard');

            } catch (err) {
                console.error('Login error:', err);
                showAlert('alert-box', 'Terjadi kesalahan. Silakan coba lagi.');
                btn.disabled = false;
                btn.textContent = origText;
            }
        });
    </script>
</body>
</html>
