<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Lensique Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-header">
                <h1>Product Management</h1>
                <p>Kelola produk kacamata dan lensa.</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Daftar Produk</h3>
                    <button class="btn btn-success" onclick="openProductModal()">+ Tambah Produk</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Cari nama produk..." onkeyup="handleSearch()">
                    <select id="category-filter" onchange="handleSearch()">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Gambar</th>
                                <th>Nama</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="products-table">
                            <tr><td colspan="8" class="loading">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>

    <!-- Modal Add/Edit Product -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal" style="max-width:640px">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Produk</h3>
                <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
            </div>
            <div id="modal-alert" class="alert alert-error"></div>
            <form id="product-form" onsubmit="return false;">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="prod-category" required>
                        <option value="">Pilih Kategori</option>
                    </select>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div class="form-group">
                        <label>Harga</label>
                        <input type="number" id="prod-price" required>
                    </div>
                    <div class="form-group">
                        <label>Stok</label>
                        <input type="number" id="prod-stock" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="prod-desc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="prod-status">
                        <option value="1">Aktif</option>
                        <option value="0">Nonaktif</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Gambar Produk</label>
                    <input type="file" id="prod-images" multiple accept="image/jpeg,image/jpg,image/png">
                    <small style="color:var(--text-muted)">Format: JPG, JPEG, PNG. Maksimal 2MB per file.</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm" onclick="closeModal('product-modal')" style="background:#eee">Batal</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveProduct()">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        if (!requireAuth()) {}
        renderSidebar('products');

        let currentPage = 1;
        let currentSearch = '';
        let categories = [];

        async function loadCategories() {
            try {
                const data = await apiGet('/api/admin/products/kategori');
                categories = data.data;
                const opts = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                document.getElementById('category-filter').innerHTML = '<option value="">Semua Kategori</option>' + opts;
                document.getElementById('prod-category').innerHTML = '<option value="">Pilih Kategori</option>' + opts;
            } catch (err) {
                console.error('Load categories error:', err);
            }
        }

        async function loadProducts(page = 1) {
            currentPage = page;
            try {
                const cat = document.getElementById('category-filter').value;
                let url = `/api/admin/products?page=${page}&limit=10&search=${encodeURIComponent(currentSearch)}`;
                if (cat) url += `&category=${cat}`;
                const data = await apiGet(url);
                const tbody = document.getElementById('products-table');

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Tidak ada produk</td></tr>';
                } else {
                    tbody.innerHTML = data.data.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td>
                                <img src="${p.image_url || '/public/img/no-image.svg'}" style="width:50px;height:50px;object-fit:cover;border-radius:8px" onerror="this.src='/public/img/no-image.svg'">
                            </td>
                            <td>${p.name}</td>
                            <td>${p.category_name || '-'}</td>
                            <td>${formatRupiah(p.base_price)}</td>
                            <td>${p.stock}</td>
                            <td><span class="badge ${p.is_active ? 'badge-success' : 'badge-danger'}">${p.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editProduct(${p.id})">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
                }

                renderPagination('pagination', data.pagination.page, data.pagination.totalPages, 'loadProducts');

            } catch (err) {
                document.getElementById('products-table').innerHTML = `<tr><td colspan="8" class="empty-state">${err.message}</td></tr>`;
            }
        }

        function handleSearch() {
            currentSearch = document.getElementById('search-input').value;
            loadProducts(1);
        }

        function openProductModal() {
            document.getElementById('modal-title').textContent = 'Tambah Produk';
            document.getElementById('product-id').value = '';
            document.getElementById('product-form').reset();
            hideAlert('modal-alert');
            openModal('product-modal');
        }

        async function editProduct(id) {
            try {
                const data = await apiGet(`/api/admin/products/${id}`);
                const p = data.data;
                document.getElementById('modal-title').textContent = 'Edit Produk';
                document.getElementById('product-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-category').value = p.category_id || '';
                document.getElementById('prod-price').value = p.base_price;
                document.getElementById('prod-stock').value = p.stock;
                document.getElementById('prod-desc').value = p.description || '';
                document.getElementById('prod-status').value = p.is_active;
                hideAlert('modal-alert');
                openModal('product-modal');
            } catch (err) {
                alert(err.message);
            }
        }

        async function saveProduct() {
            hideAlert('modal-alert');
            const id = document.getElementById('product-id').value;
            const formData = new FormData();
            formData.append('name', document.getElementById('prod-name').value);
            formData.append('category_id', document.getElementById('prod-category').value);
            formData.append('base_price', document.getElementById('prod-price').value);
            formData.append('stock', document.getElementById('prod-stock').value);
            formData.append('description', document.getElementById('prod-desc').value);
            formData.append('is_active', document.getElementById('prod-status').value);

            const files = document.getElementById('prod-images').files;
            for (let i = 0; i < files.length; i++) {
                formData.append('images', files[i]);
            }

            try {
                if (id) {
                    await apiPutForm(`/api/admin/products/${id}`, formData);
                } else {
                    await apiPostForm('/api/admin/products', formData);
                }
                closeModal('product-modal');
                loadProducts(currentPage);
            } catch (err) {
                showAlert('modal-alert', err.message);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Yakin ingin menghapus produk ini?')) return;
            try {
                await apiDelete(`/api/admin/products/${id}`);
                loadProducts(currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        loadCategories();
        loadProducts();
    </script>
</body>
</html>
