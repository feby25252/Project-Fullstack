<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Lensique Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-header">
                <h1>Reviews</h1>
                <p>Kelola ulasan produk dari pengguna.</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Daftar Review</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produk</th>
                                <th>User</th>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="reviews-table">
                            <tr><td colspan="7" class="loading">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        if (!requireAuth()) {}
        renderSidebar('reviews');

        let currentPage = 1;

        async function loadReviews(page = 1) {
            currentPage = page;
            try {
                const data = await apiGet(`/api/admin/reviews?page=${page}&limit=10`);
                const tbody = document.getElementById('reviews-table');

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada review</td></tr>';
                } else {
                    tbody.innerHTML = data.data.map(r => `
                        <tr>
                            <td>${r.id}</td>
                            <td>${r.product_name || '-'}</td>
                            <td>${r.username || '-'}</td>
                            <td><span class="badge badge-warning">${r.rating} ⭐</span></td>
                            <td style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.comment || '-'}</td>
                            <td>${formatDate(r.created_at)}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="deleteReview(${r.id})">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
                }

                renderPagination('pagination', data.pagination.page, data.pagination.totalPages, 'loadReviews');

            } catch (err) {
                document.getElementById('reviews-table').innerHTML = `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;
            }
        }

        async function deleteReview(id) {
            if (!confirm('Yakin ingin menghapus review ini?')) return;
            try {
                await apiDelete(`/api/admin/reviews/${id}`);
                loadReviews(currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        loadReviews();
    </script>
</body>
</html>
