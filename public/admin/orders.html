<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pesanan - Lensique Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <style>
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pending { background: var(--soft-yellow); color: #D68910; }
        .status-paid { background: var(--soft-green); color: #27AE60; }
        .status-processing { background: var(--baby-blue); color: #2874A6; }
        .status-packed { background: var(--soft-purple); color: #8E44AD; }
        .status-shipped { background: #D5DBDB; color: #2C3E50; }
        .status-delivered { background: var(--soft-green); color: #1E8449; }
        .status-cancelled { background: var(--soft-pink); color: #C0392B; }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 8px 14px; border: 2px solid #E8E8E8; border-radius: 12px; font-size: 14px; }
        .filter-bar input { flex: 1; min-width: 200px; }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--soft-purple); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-header">
                <h1>Kelola Pesanan</h1>
                <p>Lihat dan kelola semua pesanan masuk.</p>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Cari nomor pesanan, username, atau email..." onkeyup="debounceLoad()">
                <select id="statusFilter" onchange="loadOrders(1)">
                    <option value="">Semua Status</option>
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="processing">Processing</option>
                    <option value="packed">Packed</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                </select>
                <select id="paymentFilter" onchange="loadOrders(1)">
                    <option value="">Semua Pembayaran</option>
                    <option value="pending">Unpaid</option>
                    <option value="paid">Paid</option>
                    <option value="failed">Failed</option>
                </select>
                <button class="btn btn-primary btn-sm" onclick="loadOrders(1)">
                    <i class="bi bi-search"></i> Cari
                </button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Daftar Pesanan</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No. Pesanan</th>
                                <th>User</th>
                                <th>Total</th>
                                <th>Status Pesanan</th>
                                <th>Status Bayar</th>
                                <th>Pengiriman</th>
                                <th>Tanggal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                            <tr><td colspan="8" class="loading">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        if (!requireAuth()) { throw new Error('redirect'); }
        renderSidebar('orders');

        let currentPage = 1;
        let debounceTimer = null;

        function debounceLoad() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => loadOrders(1), 400);
        }

        async function loadOrders(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchInput').value.trim();
            const status = document.getElementById('statusFilter').value;
            const payment = document.getElementById('paymentFilter').value;

            let url = `/api/admin/orders?page=${page}&limit=10`;
            if (status) url += `&status=${status}`;
            if (payment) url += `&payment_status=${payment}`;
            if (search) url += `&search=${encodeURIComponent(search)}`;

            try {
                const data = await apiGet(url);
                const tbody = document.getElementById('orders-table');

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">Tidak ada pesanan</td></tr>';
                } else {
                    tbody.innerHTML = data.data.map(o => `
                        <tr style="cursor:pointer" onclick="window.location.href='/admin/orders/${o.id}'">
                            <td><strong>${o.order_number}</strong></td>
                            <td>
                                <div>${o.username || '-'}</div>
                                <small class="text-muted">${o.email || ''}</small>
                            </td>
                            <td>${formatRupiah(o.total_amount)}</td>
                            <td><span class="status-badge status-${o.order_status || o.status}">${formatStatus(o.order_status || o.status)}</span></td>
                            <td><span class="badge badge-${o.payment_status === 'paid' ? 'success' : o.payment_status === 'failed' ? 'danger' : 'warning'}">${o.payment_status || 'pending'}</span></td>
                            <td>
                                <div>${o.shipping_status || 'waiting'}</div>
                                ${o.tracking_number ? `<small class="text-muted">Resi: ${o.tracking_number}</small>` : ''}
                            </td>
                            <td>${formatDate(o.created_at)}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); window.location.href='/admin/orders/${o.id}'">
                                    <i class="bi bi-eye"></i> Detail
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }

                renderPagination('pagination', data.pagination.page, data.pagination.totalPages, 'loadOrders');

            } catch (err) {
                document.getElementById('orders-table').innerHTML = `<tr><td colspan="8" class="empty-state">${err.message}</td></tr>`;
            }
        }

        function formatStatus(status) {
            const map = {
                'pending': 'Pending',
                'paid': 'Paid',
                'processing': 'Processing',
                'packed': 'Packed',
                'shipped': 'Shipped',
                'delivered': 'Delivered',
                'cancelled': 'Cancelled'
            };
            return map[status] || status;
        }

        loadOrders();
    </script>
</body>
</html>
