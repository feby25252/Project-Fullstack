<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Lensique Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-header">
                <h1>User Management</h1>
                <p>Kelola semua pengguna aplikasi Lensique.</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Daftar User</h3>
                    <button class="btn btn-success" onclick="openUserModal()">+ Tambah User</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Cari username, email, atau nama..." onkeyup="handleSearch()">
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nama</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Terakhir Login</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="users-table">
                            <tr><td colspan="7" class="loading">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination"></div>
            </div>
        </main>
    </div>

    <!-- Modal Add/Edit User -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Tambah User</h3>
                <button class="modal-close" onclick="closeModal('user-modal')">&times;</button>
            </div>
            <div id="modal-alert" class="alert alert-error"></div>
            <form id="user-form" onsubmit="return false;">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="user-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="user-email" required>
                </div>
                <div class="form-group" id="password-group">
                    <label>Password</label>
                    <input type="password" id="user-password">
                    <small style="color:var(--text-muted)">Kosongkan jika tidak ingin mengubah password</small>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="user-fullname">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="user-role">
                        <option value="2">User</option>
                        <option value="1">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="user-bio" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="user-phone">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea id="user-address" rows="2"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm" onclick="closeModal('user-modal')" style="background:#eee">Batal</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveUser()">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        if (!requireAuth()) { throw new Error('redirect'); }
        renderSidebar('users');

        let currentPage = 1;
        let currentSearch = '';

        async function loadUsers(page = 1) {
            currentPage = page;
            try {
                const url = `/api/admin/users?page=${page}&limit=10&search=${encodeURIComponent(currentSearch)}`;
                const data = await apiGet(url);
                const tbody = document.getElementById('users-table');

                if (data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada user</td></tr>';
                } else {
                    tbody.innerHTML = data.data.map(u => `
                        <tr>
                            <td>${u.id}</td>
                            <td>
                                <strong>${u.full_name || u.username}</strong><br>
                                <small style="color:var(--text-muted)">@${u.username}</small>
                            </td>
                            <td>${u.email}</td>
                            <td><span class="badge ${u.role_id === 1 ? 'badge-info' : 'badge-success'}">${u.role_name || (u.role_id === 1 ? 'Admin' : 'User')}</span></td>
                            <td><span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}">${u.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
                            <td>${formatDate(u.last_login)}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editUser(${u.id})">Edit</button>
                                <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleUser(${u.id}, ${u.is_active ? 0 : 1})">${u.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
                }

                renderPagination('pagination', data.pagination.page, data.pagination.totalPages, 'loadUsers');

            } catch (err) {
                document.getElementById('users-table').innerHTML = `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;
            }
        }

        function handleSearch() {
            currentSearch = document.getElementById('search-input').value;
            loadUsers(1);
        }

        function openUserModal() {
            document.getElementById('modal-title').textContent = 'Tambah User';
            document.getElementById('user-id').value = '';
            document.getElementById('user-form').reset();
            document.getElementById('password-group').querySelector('small').textContent = '';
            hideAlert('modal-alert');
            openModal('user-modal');
        }

        async function editUser(id) {
            try {
                const data = await apiGet(`/api/admin/users/${id}`);
                const u = data.data;
                document.getElementById('modal-title').textContent = 'Edit User';
                document.getElementById('user-id').value = u.id;
                document.getElementById('user-username').value = u.username;
                document.getElementById('user-email').value = u.email;
                document.getElementById('user-fullname').value = u.full_name || '';
                document.getElementById('user-role').value = u.role_id;
                document.getElementById('user-bio').value = u.bio || '';
                document.getElementById('user-phone').value = u.phone || '';
                document.getElementById('user-address').value = u.address || '';
                document.getElementById('password-group').querySelector('small').textContent = 'Kosongkan jika tidak ingin mengubah password';
                hideAlert('modal-alert');
                openModal('user-modal');
            } catch (err) {
                alert(err.message);
            }
        }

        async function saveUser() {
            hideAlert('modal-alert');
            const id = document.getElementById('user-id').value;
            const payload = {
                username: document.getElementById('user-username').value,
                email: document.getElementById('user-email').value,
                full_name: document.getElementById('user-fullname').value,
                role_id: parseInt(document.getElementById('user-role').value),
                bio: document.getElementById('user-bio').value,
                phone: document.getElementById('user-phone').value,
                address: document.getElementById('user-address').value
            };

            const password = document.getElementById('user-password').value;
            if (password) payload.password = password;

            try {
                if (id) {
                    await apiPut(`/api/admin/users/${id}`, payload);
                } else {
                    if (!password) {
                        showAlert('modal-alert', 'Password wajib diisi untuk user baru.');
                        return;
                    }
                    payload.password = password;
                    await apiPost('/api/admin/users', payload);
                }
                closeModal('user-modal');
                loadUsers(currentPage);
            } catch (err) {
                showAlert('modal-alert', err.message);
            }
        }

        async function toggleUser(id, isActive) {
            if (!confirm(isActive ? 'Aktifkan user ini?' : 'Nonaktifkan user ini?')) return;
            try {
                await apiPut(`/api/admin/users/${id}/active`, { is_active: isActive });
                loadUsers(currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Yakin ingin menghapus user ini?')) return;
            try {
                await apiDelete(`/api/admin/users/${id}`);
                loadUsers(currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        loadUsers();
    </script>
</body>
</html>
